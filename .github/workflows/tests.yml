# Runs on every change. Written by Claude (AI).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-pairs:
    # Needs only Python: checks the pairs file and recomputes every reference answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tools/check_pairs.py
      - run: python3 -m unittest discover -s tests -v

  tools-under-test:
    # Installs the tools at the versions in requirements-adapters.txt and runs
    # every adapter test. A failure here can mean a tool changed, not only that
    # our code did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-adapters.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Every adapter must have run, not been skipped
        run: |
          python3 -m unittest discover -s tests 2>&1 | tee out.txt
          if grep -q "skipped" out.txt; then echo "some adapter tests were skipped"; exit 1; fi
